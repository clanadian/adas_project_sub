<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ADAS WebRTC</title>
  <style>
    html, body { margin: 0; height: 100%; background: #101216; color: #e8eaed;
      font: 14px system-ui, sans-serif; }
    main { height: 100%; display: grid; grid-template-rows: auto 1fr; }
    header { padding: .6rem 1rem; }
    iframe { width: 100%; height: 100%; border: 0; background: #000; }
  </style>
</head>
<body>
<main>
  <header>ADAS annotated WebRTC stream</header>
  <!-- Replace 10.10.16.200 with the Raspberry Pi address. -->
  <iframe
    src="http://10.10.16.200:8889/adas?controls=false&muted=true&autoplay=true&playsInline=true"
    allow="autoplay; fullscreen"
    scrolling="no"></iframe>
</main>
</body>
</html>
