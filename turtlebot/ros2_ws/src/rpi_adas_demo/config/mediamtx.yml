# Local RTSP ingest and browser WebRTC egress for the annotated ADAS stream.
logLevel: info
rtsp: yes
rtspAddress: :8554
# MediaMTX v1.9.x uses the global key "protocols".
protocols: [tcp]
rtmp: no
hls: no
srt: no
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189

pathDefaults:
  source: publisher

paths:
  adas:
